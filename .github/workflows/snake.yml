# GitHub Action untuk generate snake animation dari contribution graph
# Simpan file ini di: .github/workflows/snake.yml di repo zeeks024/zeeks024

name: Generate Snake Animation

on:
  # Jalankan setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  
  # Jalankan saat push ke main
  push:
    branches:
      - main
  
  # Bisa trigger manual dari Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: zeeks024
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
